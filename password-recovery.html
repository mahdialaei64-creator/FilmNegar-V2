<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1b33">
  <title>بازیابی رمز عبور | فیلم نگار</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f3f6fb;--card:#fff;--tx:#1d1d1f;--mu:#6b6b70;--ac:#c0392b;--bd:#e3e1dc}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7;display:grid;place-items:center;padding:18px}
    main{width:100%;max-width:420px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;box-shadow:0 8px 30px #0001}
    h1{font-size:21px;margin:0 0 8px}.hint{font-size:13px;color:var(--mu);margin:0 0 16px}
    input,button{font:inherit;font-size:14px;width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:9px;margin:0 0 10px;background:var(--card);color:var(--tx)}
    button{cursor:pointer;background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}button:disabled{opacity:.6;cursor:wait}
    #msg{min-height:24px;font-size:13px;color:var(--ac);white-space:pre-wrap}.back{display:block;text-align:center;color:var(--mu);font-size:13px;margin-top:8px}
  </style>
</head>
<body>
<main><section class="card">
  <h1>🔐 بازیابی رمز عبور فیلم نگار</h1>
  <p class="hint" id="hint">ایمیل حساب را وارد کن تا لینک امن بازیابی برایت ارسال شود. اگر از لینک ایمیل وارد این صفحه شده‌ای، رمز جدیدت را ثبت کن.</p>
  <div id="requestForm">
    <input id="email" type="email" dir="ltr" autocomplete="email" placeholder="ایمیل حساب">
    <button id="sendBtn" type="button" onclick="sendRecoveryEmail()">ارسال لینک بازیابی</button>
  </div>
  <div id="passwordForm" hidden>
    <input id="password" type="password" autocomplete="new-password" placeholder="رمز جدید (حداقل ۶ کاراکتر)">
    <input id="password2" type="password" autocomplete="new-password" placeholder="تکرار رمز جدید">
    <button id="saveBtn" type="button" onclick="saveNewPassword()">ذخیرهٔ رمز جدید</button>
  </div>
  <div id="msg" role="status" aria-live="polite"></div>
  <a class="back" href="./">بازگشت به فیلم نگار</a>
</section></main>
<script>
  // این‌ها همان URL و کلید عمومی (publishable/anon) پروژه‌اند؛ کلید مدیریتی را اینجا قرار نده.
  const SUPABASE_URL='https://mrshvucwpohsrkmjhmfi.supabase.co';
  const SUPABASE_KEY='sb_publishable_cllLZZIC9Ejjp5pxDJAqmw_SWVUoD38';
  const msg=document.getElementById('msg');
  const recovery=new URLSearchParams(location.hash.slice(1));
  const recoveryToken=recovery.get('access_token');
  if(recovery.get('type')==='recovery'&&recoveryToken){
    document.getElementById('requestForm').hidden=true;
    document.getElementById('passwordForm').hidden=false;
    document.getElementById('hint').textContent='لینک تأیید شد. رمز جدید را وارد و ذخیره کن.';
  }else if(recovery.get('error')){
    msg.textContent='لینک بازیابی معتبر نیست یا منقضی شده. دوباره درخواست لینک بده.';
  }
  async function api(path,options={}){
    const response=await fetch(SUPABASE_URL+path,{...options,headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json',...(options.headers||{})}});
    const text=await response.text();let data=null;try{data=text?JSON.parse(text):null}catch{}
    if(!response.ok)throw new Error(data?.msg||data?.message||data?.error_description||data?.error||'درخواست انجام نشد. دوباره تلاش کن.');
    return data;
  }
  async function sendRecoveryEmail(){
    const email=document.getElementById('email').value.trim();
    const button=document.getElementById('sendBtn');msg.textContent='';
    if(!email){msg.textContent='لطفاً ایمیل حساب را وارد کن.';return;}
    button.disabled=true;button.textContent='در حال ارسال…';
    try{
      const redirectTo=location.origin+location.pathname;
      await api('/auth/v1/recover?redirect_to='+encodeURIComponent(redirectTo),{method:'POST',body:JSON.stringify({email})});
      msg.textContent='اگر این ایمیل در سامانه ثبت شده باشد، لینک بازیابی ارسال می‌شود. صندوق ورودی و Spam را بررسی کن.';
    }catch(error){msg.textContent=error.message;}
    finally{button.disabled=false;button.textContent='ارسال لینک بازیابی';}
  }
  async function saveNewPassword(){
    const password=document.getElementById('password').value;
    const password2=document.getElementById('password2').value;
    const button=document.getElementById('saveBtn');msg.textContent='';
    if(password.length<6){msg.textContent='رمز عبور باید حداقل ۶ کاراکتر باشد.';return;}
    if(password!==password2){msg.textContent='دو رمز واردشده یکسان نیستند.';return;}
    if(!recoveryToken){msg.textContent='لینک بازیابی معتبر نیست یا منقضی شده. دوباره درخواست لینک بده.';return;}
    button.disabled=true;button.textContent='در حال ذخیره…';
    try{
      await api('/auth/v1/user',{method:'PUT',headers:{Authorization:'Bearer '+recoveryToken},body:JSON.stringify({password})});
      history.replaceState(null,'',location.pathname);
      document.getElementById('passwordForm').hidden=true;
      document.getElementById('hint').textContent='رمز با موفقیت تغییر کرد. حالا با رمز جدید وارد اپ شو.';
      msg.textContent='رمز عبور با موفقیت تغییر کرد.';
    }catch(error){msg.textContent=error.message;button.disabled=false;button.textContent='ذخیرهٔ رمز جدید';}
  }
</script>
</body>
</html>
