function impFile(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{document.getElementById('it').value=r.result;IMCSV=/\.csv$/i.test(f.name)};r.readAsText(f)}
function parseLines(t,csv){const o=[],seen=new Set();
for(let ln of String(t).split(/\r?\n/)){ln=ln.trim();if(!ln||ln[0]==='#')continue;
if(csv){const m=ln.match(/^"([^"]*)"|^([^,]*)/);ln=(m[1]??m[2]??'').trim()}
ln=ln.replace(/^[\s\u200f\u200e]*(?:[\d۰-۹]+\s*[.\-)\]:،]|[-•*▪▫✅☑🎬▶►●○◦]+)\s*/u,'');
let y='';const ym=ln.match(/[(\[]?\b((?:19|20)\d\d)\b[)\]]?/);if(ym){y=ym[1];ln=ln.replace(ym[0],'')}
ln=ln.replace(/[⭐📝].*$/u,'').replace(/\s*[—–\-]\s*(فیلم|سریال)\s*$/,'').trim().replace(/^["«]+|["»]+$/g,'').trim();
if(ln.length<2||ln.length>80||seen.has(ln.toLowerCase()))continue;seen.add(ln.toLowerCase());o.push({t:ln,y})}
return o.slice(0,80)}
function impGo(){const L=parseLines(document.getElementById('it').value,IMCSV);if(!L.length){alert('هیچ نامی پیدا نشد');return}impRun(L,document.getElementById('is').value)}
async function impRun(items,st){IM={rows:items.map(s=>({s,m:undefined,on:true})),st};

try{const res=await tmSearch(r.s.t);r.m=(r.s.y&&res.find(m=>m.y==r.s.y))||res[0]||null}catch(e){r.m=null}
n++;const e=document.getElementById('ipr');if(e)e.textContent=n+' از '+IM.rows.length}}));
impShow()}

function impCommit(){let c=0;IM.rows.forEach((r,i)=>{if(!r.on)return;let m=r.m;
if(m){if(!all().find(x=>x.id===m.id))S.custom.push({...m,custom:1,tm:1})}
else{const x=r.s.x||{};m={id:'c'+Date.now()+'_'+i,t:r.s.t,k:x.k||'film',o:x.o||(/[\u0600-\u06FF]/.test(r.s.t)?'ایرانی':'خارجی'),y:r.s.y||x.y||'',g:x.g||'',en:x.e||'',d:'',img:x.img||'',custom:1};S.custom.push(m)}
S.lib[m.id]={...(S.lib[m.id]||{}),st:IM.st};c++});
save();close_();history.replaceState(null,'',location.pathname);S.tab='lists';S.lt=IM.st;render();alert(c+' مورد اضافه شد')}
